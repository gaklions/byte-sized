# byte-sized configuration
# All values shown are defaults; uncomment + adjust to override.

storage:
  # Where bite files and the index live (relative to repo root).
  bites_dir: ".specify/bites"
  # Prefix used when allocating new bite IDs (BB-<DOMAIN>-NNN).
  id_prefix: "BB"

relevance:
  # Hard cap on the number of bites a `query`/`surface` call returns.
  max_results: 12
  # Minimum lexical score (0-1) before a bite is included in results.
  min_score: 0.2
  # N-hop neighbour expansion for `show` (and optionally `surface`).
  include_neighbors: 1
  # Output-size guard for projections (truncate beyond this size, KB).
  max_projection_kb: 8

extraction:
  # When true, `after_specify` / `after_clarify` hooks propose drafts automatically.
  auto_propose: true
  # When true, drafts must be promoted via `byte-sized.add` before becoming active.
  require_review: true
  # Subdirectory under bites_dir where staged drafts live.
  drafts_dir: "_drafts"

portal:
  # Loopback host the review portal binds to. Non-loopback values are refused at startup.
  host: "127.0.0.1"
  # TCP port for the review portal.
  port: 7821
  # If true, the wrapper scripts open the user's default browser after the server is up.
  open_browser: true
  # Auto-handle thresholds for the Drafts review pane (0.0 disables each).
  # `novel_below` auto-approves stubs whose closest-active token-overlap score is below this.
  # `duplicate_above` auto-rejects stubs whose closest-active score is at or above this.
  auto_handle:
    novel_below: 0.0
    duplicate_above: 0.0

conflict_detection:
  enabled: true
  # Token pairs that, when both appear across two bites in the same domain, trigger a conflict candidate.
  # Add domain-specific antonym pairs as needed.
  antonym_pairs:
    - ["must", "must not"]
    - ["required", "forbidden"]
    - ["allow", "deny"]
    - ["enable", "disable"]
    - ["always", "never"]

# Whitelist of allowed domains. New domains can be added; bites-validate warns on values outside this list.
domains:
  - architecture
  - auth
  - code
  - compliance
  - data
  - pricing
  - security
  - tech
  - ux

# Domain hints applied to surface() per phase (used by `before_*` hooks).
phase_hints:
  before_specify: []
  before_plan: ["architecture", "tech"]
  before_implement: ["code", "compliance"]
